# cargo-about: gathers the licence texts of every package the app ships with,
# for THIRD-PARTY-LICENSES.html (scripts/third-party-notices.ps1 runs it).
# Only permissive licences are accepted. Packages that also offer GPL or LGPL
# offer MIT or Apache-2.0 too, and the permissive choice is the one taken.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# The platforms the app ships on.
targets = ["x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# Test-only packages are not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
