# Checks that must pass before a change is merged. First run on GitHub
# 2026-11-05 (run 42080890167); run 42086149175 was the first fully green run
# including the macOS build, so the macOS job now blocks a merge like the
# Windows one (the app still needs its first run and install on macOS, see
# ROADMAP D4).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Shows the toolchain pinned in rust-toolchain.toml; the first cargo command installs it if missing.
      - run: rustup show
      # Keeps the built dependencies between runs (the GPUI tree is large). Actions are pinned to a commit, not a moving tag.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The version is pinned so the audit does not change without a commit; rust-cache keeps the installed binary.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit
