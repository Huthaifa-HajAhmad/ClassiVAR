# Checks that must pass before a change is merged. First run on GitHub
# 2026-11-05 (run 42080890167); run 42086149175 was the first fully green run
# including the macOS build, so the macOS job now blocks a merge like the
# Windows one (the app still needs its first run and install on macOS, see
# ROADMAP D4).
#
# The checks run as separate jobs, side by side, so a run takes as long as its
# slowest check and not the sum of all of them. Each job keeps its own build
# cache. Only runs on main save a cache; pull requests read main's cache, so
# they cannot fill the repository's 10 GB cache limit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting does not depend on the system, so it runs once, and fast.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Shows the toolchain pinned in rust-toolchain.toml; the first cargo command installs it if missing.
      - run: rustup show
      - run: cargo fmt --all --check

  # Each of these three runs on Windows and on macOS. They are separate jobs so they run at the same time.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      # Keeps the built dependencies between runs (the GPUI tree is large). Actions are pinned to a commit, not a moving tag.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Builds and links the real program, which the test run does not do.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked
      # Debug-only code is compiled out here, so unused imports or dead code show only in release mode.
      - run: cargo check -p classivar --release --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A ready-made program of a pinned version (it checks the download), so nothing is compiled here.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      - run: cargo audit
