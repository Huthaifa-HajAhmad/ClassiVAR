[workspace]
resolver = "3"
members = ["crates/classivar-core", "crates/classivar-sources", "crates/classivar"]

[workspace.package]
version = "1.0.0"
edition = "2024"
# The oldest Rust that builds this project is not measured; the pinned toolchain
# (rust-toolchain.toml) is the one that is tested.
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

# Dependencies (the bulk of the 800-odd packages in Cargo.lock, GPUI included)
# build without debug info in dev and test profiles. Our own crates keep it, so
# backtraces still give file and line for ClassiVAR code. Measured on the pinned
# toolchain: target/ is 2.1 GB against 5.0 GB with dependency debug info, and the
# 2.1 GB figure also holds the test binaries, so the real saving is larger.
# A package override beats CARGO_PROFILE_DEV_DEBUG, so comment this block out (or
# name a single crate here) when a dependency needs a line table.
# The build that ships: optimised across crates and stripped of symbols, so the
# installer is smaller. Panics still print their message.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
debug = false

# The drawing and layout code runs on every frame. Unoptimised, it makes the dev
# window feel slow. These are the eight crates the GPUI Kit installation guide lists
# for optimisation; it says to leave proc-macro crates such as gpui-pre-macros out,
# because they only run inside the compiler. Our own crates stay unoptimised so
# rebuilds stay quick.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
