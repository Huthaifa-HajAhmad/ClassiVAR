# Rule set: ACMG/AMP 2015 criteria with the points scoring system.
#
# STATUS: DRAFT, UNVERIFIED. Written from the author's memory of the sources
# listed below. Nothing here has been checked line by line against the papers
# yet. A qualified reviewer must verify every entry before the content is used
# for anything beyond research and learning.
#
# How to read this file:
#   [meta]           which rule set this is, and its review status
#   [[sources]]      the papers every rule points to (by id)
#   [points]         how many points each evidence strength is worth
#   [class_min_points]  the lowest total that still gives each class
#   [[vus_tiers]]    VUS sub-tiers. Numeric cut-offs are NOT published yet.
#   [[exclusive_pairs]] criteria that should not be used together
#   [[combination_caps]] two criteria that may be used together only up to a point total
#   [[predictors]]   score limits for prediction tools, for PP3 and BP4
#   [functional]     assay limits for PS3 and BS3 (controls and OddsPath)
#   [locus_evidence] PP1 and PP4 points, their joint limit, and the allowed strengths
#   [non_segregation] the situations in which BS4 does and does not apply
#   [de_novo]        PS2 points per patient, and the strength the total gives
#   [pm3]            recessive patient points (ClinGen 2019 Tables 1 and 2)
#   [[ba1_exceptions]] dated reference list (ClinGen July 2018), no automatic matching
#   [[criteria]]     the 28 ACMG/AMP criteria
#
# Changing a rule means editing this file. The program checks the file when it
# loads: every rule needs a source that exists in [[sources]].

[meta]
id = "acmg-amp-points"
name = "ACMG/AMP 2015 criteria, points scoring (draft)"
version = "0.12.0-draft"
status = "unverified"
note = "Draft. On 2026-11-03 the builder checked, against the sources on the web, the criteria wording (Richards 2015 Tables 3 and 4), the combining table (Table 5), the points and class thresholds (Tavtigian 2020, via its published summary), the PM2 recommendation (4 Sept 2020) and the PP5/BP6 recommendation (Biesecker and Harrison 2018). On 2026-11-04 an audit (docs/AUDIT-2026-11-04.md) found problems, and this version fixes them: PVS1 wording and strength guidance, the ClinGen 2020 combining addition, BP1 and PS4 wording, contradictory pairs now withhold the class, PP3 capped at Strong, discouraged criteria no longer counted. A later pass added the PVS1 situation guide, strength caps for weak evidence, PM4/PVS1 exclusivity, the PP1+PP4 combined cap, the BP4 Moderate ceiling, and saves the chosen PVS1 situation. Version 0.5.0 added the calibrated PP3/BP4 score limits for four tools (Pejaver 2022, Table 2) and the PM1+PP3 combined limit. Version 0.6.0 adds the functional-evidence limits for PS3/BS3 (Brnich 2019): the control-count route and the OddsPath limits. Version 0.7.0 adds the PP1/PP4 points arithmetic (ClinGen 2024, Tables 2 to 4) as a helper: points from diagnostic yield and from co-segregations, the 5 point limit, and the strength choices the paper allows. Version 0.8.0 adds a BS4 situation helper (same paper): BS4 stays Strong, and the helper applies it only where the paper supports it (not for compound heterozygotes, reduced penetrance with unaffected carriers, or high phenocopy rates). No points changed. The PP1/PP4 helper does not count PP1 when only one gene can cause the phenotype (the paper's locus homogeneity), and for several variants on one allele it divides the PP4 yield as the paper does and refuses PP1 (the paper's sharing worksheet is not built in). Version 0.9.0 adds a de novo helper for PS2 (ClinGen SVI recommendation v1.1, 2018): points per patient from how well the phenotype fits and whether the parents were confirmed, the total read as a strength (0.5, 1, 2 and 4 points for Supporting to Very Strong), and the paper's rule that a recessive gene with no second variant lowers the strength one level. No existing points or limits changed. Version 0.10.0 adds the PM3 patient points (ClinGen SVI v1.0, 2 May 2019) and raises its ceiling to Very Strong, correcting the earlier unsupported claim that no published route exists. It also adds the nine BA1 exceptions as a dated manual reference. Version 0.12.0 adds SpliceAI to the predictor table (Walker 2023, Table 1): the paper's calibrated Moderate evidence is recorded separately from the Supporting code it advises, and the helper accepts only 0-1 and asks the curator to confirm the variant is outside donor/acceptor +/-1,2. It also lets the de novo total be applied as PS2 or as PM6 (ClinGen SVI v1.1, Table 2), with PM6 still capped at Strong, and PS2 and PM6 together now raise a double-counting warning. No existing points or limits changed. This is not a qualified review. Research and learning use only."

