# Rule set: ACMG/AMP 2015 criteria with the points scoring system.
#
# STATUS: DRAFT, UNVERIFIED. Written from the author's memory of the sources
# listed below. Nothing here has been checked line by line against the papers
# yet. A qualified reviewer must verify every entry before the content is used
# for anything beyond research and learning.
#
# How to read this file:
#   [meta]           which rule set this is, and its review status
#   [[sources]]      the papers every rule points to (by id)
#   [points]         how many points each evidence strength is worth
#   [class_min_points]  the lowest total that still gives each class
#   [[vus_tiers]]    VUS sub-tiers. Numeric cut-offs are NOT published yet.
#   [[exclusive_pairs]] criteria that should not be used together
#   [[combination_caps]] two criteria that may be used together only up to a point total
#   [[predictors]]   score limits for prediction tools, for PP3 and BP4
#   [functional]     assay limits for PS3 and BS3 (controls and OddsPath)
#   [[criteria]]     the 28 ACMG/AMP criteria
#
# Changing a rule means editing this file. The program checks the file when it
# loads: every rule needs a source that exists in [[sources]].

[meta]
id = "acmg-amp-points"
name = "ACMG/AMP 2015 criteria, points scoring (draft)"
version = "0.6.0-draft"
status = "unverified"
note = "Draft. On 2026-11-03 the builder checked, against the sources on the web, the criteria wording (Richards 2015 Tables 3 and 4), the combining table (Table 5), the points and class thresholds (Tavtigian 2020, via its published summary), the PM2 recommendation (4 Sept 2020) and the PP5/BP6 recommendation (Biesecker and Harrison 2018). On 2026-11-04 an audit (docs/AUDIT-2026-11-04.md) found problems, and this version fixes them: PVS1 wording and strength guidance, the ClinGen 2020 combining addition, BP1 and PS4 wording, contradictory pairs now withhold the class, PP3 capped at Strong, discouraged criteria no longer counted. A later pass added the PVS1 situation guide, strength caps for weak evidence, PM4/PVS1 exclusivity, the PP1+PP4 combined cap, the BP4 Moderate ceiling, and saves the chosen PVS1 situation. Version 0.5.0 added the calibrated PP3/BP4 score limits for four tools (Pejaver 2022, Table 2) and the PM1+PP3 combined limit. Version 0.6.0 adds the functional-evidence limits for PS3/BS3 (Brnich 2019): the control-count route and the OddsPath limits. This is not a qualified review. Research and learning use only."

[[sources]]
id = "richards2015"
citation = "Richards S, et al. Standards and guidelines for the interpretation of sequence variants: a joint consensus recommendation of the ACMG and the AMP. Genet Med 2015;17:405-424."
doi = "10.1038/gim.2015.30"
url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC4544753/"

