# ----- Benign -----

[[criteria]]
code = "BA1"
direction = "benign"
strength = "stand_alone"
category = "population"
title = "Allele frequency above 5%"
summary = "Allele frequency is above 0.05 (5%) in any general continental population dataset of at least 2,000 observed alleles, in a gene without a gene- or variant-specific BA1 rule. On its own this is enough for Benign."
source = "ghosh2018"
note = "This is the ClinGen wording (Ghosh 2018); the 2015 paper said only 'above 5% in ESP, 1000 Genomes or ExAC'. Count alleles, not people, so X and Y need more people. Founder populations (Ashkenazi Jewish, Finnish) can carry a pathogenic allele at high frequency: be careful when only they exceed 5%. An expert panel may set a lower, gene-specific limit. Check the BA1 exceptions reference (ClinGen July 2018) before applying: it lists common variants that may still be pathogenic or uncertain. That dated list is not a complete or current variant lookup; absence does not establish eligibility for BA1. The Population frequency helper checks the 5% and 2,000-allele conditions."

[[criteria]]
code = "BS1"
direction = "benign"
strength = "strong"
max_strength = "strong"
category = "population"
title = "More frequent than expected for the disease"
summary = "The allele frequency is greater than expected for the disorder."
source = "richards2015"
note = "The frequency limit for this criterion is set per gene and disease by expert panels. ClinGen has published refinements for this criterion that are not built in yet. The strength here is the generic 2015 default and may differ for your gene or evidence."

[[criteria]]
code = "BS2"
direction = "benign"
strength = "strong"
max_strength = "strong"
category = "population"
title = "Seen in healthy adults"
summary = "Observed in a healthy adult for a fully penetrant, early-onset disease (homozygous for recessive, heterozygous for dominant, hemizygous for X-linked)."
source = "richards2015"

[[criteria]]
code = "BS3"
direction = "benign"
strength = "strong"
max_strength = "strong"
category = "functional"
title = "Functional studies show no damage"
summary = "Well-established functional studies show no damaging effect on the gene or protein."
source = "richards2015"
note = "See PS3: ClinGen's functional evidence framework (Brnich 2019) applies in both directions, and benign functional evidence reaches at most Strong. Use the functional-evidence helper in the criteria list. The strength here is the generic 2015 default."

[[criteria]]
code = "BS4"
direction = "benign"
strength = "strong"
max_strength = "strong"
category = "family_cases"
title = "Does not segregate with disease"
summary = "The variant does not follow the disease in affected family members."
source = "richards2015"
note = "ClinGen's 2024 guidance on segregation covers this criterion together with PP1. It recommends -4 points (Strong) for non-segregation in dominant, X-linked and homozygous recessive disease, and says it gives little to no evidence for compound heterozygous recessive cases; it did not formally measure the strength. Use the non-segregation helper in the criteria list to check which situation fits."

[[criteria]]
code = "BP1"
direction = "benign"
strength = "supporting"
max_strength = "supporting"
category = "variant_type"
title = "Missense where primarily truncating variants cause disease"
summary = "A missense variant in a gene for which primarily truncating (protein-shortening) variants are known to cause disease."
source = "richards2015"

[[criteria]]
code = "BP2"
direction = "benign"
strength = "supporting"
max_strength = "supporting"
category = "family_cases"
title = "In trans or in cis with a pathogenic variant"
summary = "Seen in trans with a pathogenic variant for a fully penetrant dominant disease, or in cis with a pathogenic variant in any inheritance pattern."
source = "richards2015"

[[criteria]]
code = "BP3"
direction = "benign"
strength = "supporting"
max_strength = "supporting"
category = "variant_type"
title = "In-frame change in a repetitive region"
summary = "An in-frame deletion or insertion in a repetitive region without known function."
source = "richards2015"

[[criteria]]
code = "BP4"
direction = "benign"
strength = "supporting"
max_strength = "moderate"
category = "computational"
title = "Predictions suggest no impact"
summary = "Computational evidence suggests the variant has no impact on the gene or protein."
source = "richards2015"
strength_source = "pejaver2022"
note = "ClinGen calibrated score thresholds for prediction tools (Pejaver 2022): BP4 reaches at most Moderate, while PP3 reaches at most Strong. Use the predictor helper in the criteria list for REVEL, BayesDel (no allele frequency), MutPred2, VEST4 (Pejaver 2022), AlphaMissense, VARITY_R (Bergquist 2025) or SpliceAI (splicing, Walker 2023); for any other tool choose the strength from the published table yourself. Choose one tool before you see its result."

[[criteria]]
code = "BP5"
direction = "benign"
strength = "supporting"
max_strength = "supporting"
category = "phenotype"
title = "Another cause found"
summary = "The variant is found in a case with an alternate, well-established molecular cause of the disease."
source = "richards2015"

[[criteria]]
code = "BP6"
direction = "benign"
strength = "supporting"
category = "database"
title = "Reputable source says benign"
summary = "A reputable source reports the variant as benign, but the evidence is not available to review."
source = "clingen-svi-pp5-bp6"
discouraged = true
note = "ClinGen (2018) proposed that laboratories stop using PP5 and BP6 and removed them from its curation tool. ACMG/AMP made no formal recommendation to remove them, and some tools still apply them. In this program a new assessment lists this criterion but does not count it. Earlier records that used it are still counted, so their own class can be reproduced."

[[criteria]]
code = "BP7"
direction = "benign"
strength = "supporting"
max_strength = "strong"
levels = ["supporting", "strong"]
category = "computational"
title = "Silent change with no predicted splice effect"
summary = "A synonymous (silent) variant with no predicted effect on splicing, at a nucleotide that is not highly conserved."
source = "richards2015"
strength_source = "walker2023"
note = "Walker 2023 extends BP7 to intronic variants at or beyond +7 and -21 that also meet BP4, and says not to apply it in the splice region or to a silent change at the first base or the last three bases of an exon. It advises against using conservation without a calibrated tool. Supporting is the level for a prediction. Strong (written BP7_Strong (RNA)) is only for an RNA splicing assay that shows no effect; say so in the reason. No source gives BP7 at Moderate, so it is not offered."

# Optional context questions for the guided review. Answers add sourced hints
# to the steps below; they never apply, exclude or score criteria, and every
# step stays open. Each question allows "other" and "unknown". Predicted and
# observed splicing effects are separated per Walker 2023.

[[facts]]
id = "consequence"
question = "What is the variant's predicted coding consequence?"
answers = ["null", "missense", "in-frame indel", "synonymous", "intronic", "other", "unknown"]

[[facts]]
id = "splicing"
question = "Is there predicted or observed impact on splicing?"
answers = [
  "canonical splice (±1,2)",
  "predicted splicing impact",
  "no predicted splicing impact",
  "observed abnormal splicing (RNA)",
  "observed normal splicing (RNA)",
  "other",
  "unknown",
]

# The guided review order (approved 2026-11-27). A step names a helper only when
# all of that helper's criteria are on the step, so the PP1/PP4 helper is not
# named here (PP4 is a case-data question, PP1 a segregation question).

[[path]]
id = "population"
question = "How common is the variant in population data?"
criteria = ["BA1", "BS1", "PM2"]
helper = "population"

[[path]]
id = "variant-type"
question = "What kind of change is it, and where?"
criteria = ["PVS1", "PS1", "PM1", "PM4", "PM5", "PP2", "BP1", "BP3", "BP7"]

[[path.hints]]
fact = "consequence"
answer = "null"
source = "abou-tayoun2018"
text = "Null variants (nonsense, frameshift, canonical ±1,2 splice, start-loss, exon deletion) are evaluated with the PVS1 guide (gene-level mechanism first, then variant situation). Do not combine PM4 with PVS1."

[[path.hints]]
fact = "consequence"
answer = "missense"
source = "richards2015"
text = "Missense variants are typically considered under PS1, PM1, PM5, PP2 and BP1. PVS1, PM4, BP3 and BP7 normally do not apply to a missense change unless splicing is affected."

[[path.hints]]
fact = "consequence"
answer = "in-frame indel"
source = "richards2015"
text = "In-frame deletions and insertions are typically evaluated under PM4 (non-repeat region) or BP3 (repetitive region without known function), and PM1 if in a critical domain."

[[path.hints]]
fact = "consequence"
answer = "synonymous"
source = "walker2023"
text = "Synonymous (silent) variants are relevant to BP7 when no splicing impact is predicted (outside the first base and last three bases of an exon). Check splicing predictions before applying BP7."

[[path.hints]]
fact = "consequence"
answer = "intronic"
source = "walker2023"
text = "Walker 2023 extends BP7 Supporting to intronic variants at or beyond +7 and -21 that also meet BP4; canonical ±1,2 splice variants go through the PVS1 guide instead."

[[path.hints]]
fact = "splicing"
answer = "canonical splice (±1,2)"
source = "walker2023"
text = "Canonical ±1,2 splice variants go through the PVS1 guide (consider exon skipping and cryptic splice sites, using the lowest strength). Do not also apply PP3 for the splice prediction."

[[path.hints]]
fact = "splicing"
answer = "predicted splicing impact"
source = "walker2023"
text = "A predicted splicing impact outside ±1,2 is assessed via PP3 on the predictors step (not PVS1); BP7 does not apply when a splicing impact is predicted."

[[path.hints]]
fact = "splicing"
answer = "no predicted splicing impact"
source = "walker2023"
text = "With no predicted splicing impact (BP4 met), BP7 Supporting may apply to synonymous variants (outside the first base and last three bases of an exon) or intronic variants at or beyond +7 and -21."

[[path.hints]]
fact = "splicing"
answer = "observed abnormal splicing (RNA)"
source = "walker2023"
text = "Observed abnormal splicing from an RNA assay can inform PVS1 (as PVS1 (RNA)) rather than adding PP3 on top; check assay quality and transcript relevance before counting."

[[path.hints]]
fact = "splicing"
answer = "observed normal splicing (RNA)"
source = "walker2023"
text = "Observed normal splicing from an RNA assay can support BP7 at Strong (BP7_Strong (RNA)); record the assay details in the reason."

[[path]]
id = "predictors"
question = "What do the predictors say?"
criteria = ["PP3", "BP4"]
helper = "predictor"

[[path.hints]]
fact = "consequence"
answer = "missense"
source = "pejaver2022"
text = "For missense variants, pick one calibrated missense predictor (REVEL, BayesDel without AF, MutPred2 or VEST4: Pejaver 2022; AlphaMissense or VARITY_R: Bergquist 2025) before looking at its score. PP3 is applied once."

[[path.hints]]
fact = "consequence"
answer = "synonymous"
source = "walker2023"
text = "For synonymous variants outside ±1,2, use SpliceAI in the predictor helper: ≥0.2 supports PP3 Supporting and ≤0.1 supports BP4 Supporting."

[[path.hints]]
fact = "consequence"
answer = "intronic"
source = "walker2023"
text = "For intronic variants outside ±1,2, SpliceAI in the predictor helper gives PP3 Supporting (≥0.2) or BP4 Supporting (≤0.1)."

[[path.hints]]
fact = "splicing"
answer = "canonical splice (±1,2)"
source = "walker2023"
text = "Do not apply SpliceAI PP3/BP4 for canonical ±1,2 splice variants: those positions are evaluated through the PVS1 guide so splicing impact is not counted twice."

[[path.hints]]
fact = "splicing"
answer = "observed abnormal splicing (RNA)"
source = "walker2023"
text = "When observed RNA splicing data are used under PVS1 or PS3, remove PP3/BP4 from the splicing prediction so the same splicing effect is not counted twice."

[[path]]
id = "functional"
question = "What do functional studies show?"
criteria = ["PS3", "BS3"]
helper = "functional"

[[path.hints]]
fact = "splicing"
answer = "observed abnormal splicing (RNA)"
source = "brnich2019"
text = "Do not double count an RNA splicing assay under both PVS1 and PS3 (Brnich 2019; Walker 2023)."

[[path.hints]]
fact = "splicing"
answer = "observed normal splicing (RNA)"
source = "walker2023"
text = "RNA splicing evidence showing no splicing impact is captured under BP7_Strong (RNA) rather than BS3 for synonymous or intronic variants."

[[path]]
id = "case-data"
question = "How often is it seen in affected and healthy people?"
criteria = ["PS4", "PP4", "BS2"]

[[path]]
id = "segregation"
question = "Does it track with disease in families?"
criteria = ["PP1", "BS4"]
helper = "segregation"

[[path]]
id = "de-novo"
question = "Did it arise de novo?"
criteria = ["PS2", "PM6"]
helper = "de-novo"

[[path]]
id = "other-allele"
question = "What is on the other allele?"
criteria = ["PM3", "BP2"]
helper = "pm3"

[[path]]
id = "other-cause"
question = "Is there another cause for the disease?"
criteria = ["BP5"]

[[path]]
id = "other-sources"
question = "What do other sources report? Reference only."
criteria = ["PP5", "BP6"]
