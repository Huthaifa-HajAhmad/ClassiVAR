doi = "10.1016/j.gim.2025.101400"

[[sources]]
id = "mighton2026"
citation = "Mighton C, et al. Points to consider for the reporting of variants of uncertain significance in germline genetic and genomic testing: a statement of the ACMG. Genet Med 2026;28:102583."
doi = "10.1016/j.gim.2026.102583"

# Points per evidence strength (magnitude). Pathogenic evidence adds this many
# points, benign evidence subtracts it. "stand_alone" is only used by BA1 and
# is treated here as equal to very strong benign evidence (8 points). That
# equality is this file's own modelling choice, not a value from Tavtigian 2020,
# which has no stand-alone level. It makes BA1 alone reach Benign (-8 <= -7).
# The program also enforces the stronger rule from Richards 2015: while BA1 is
# applied the class is Benign, unless pathogenic evidence also reaches a rule on
# its own. That last case is withheld, because a known pathogenic variant can be
# common (the reason ClinGen keeps a BA1 exception list).
[points]
supporting = 1
moderate = 2
strong = 4
very_strong = 8
stand_alone = 8

# Lowest total points for each class. Anything below likely_benign is Benign.
# Source: tavtigian2020 (to be verified by the reviewer).
[class_min_points]
pathogenic = 10
likely_pathogenic = 6
vus = 0
likely_benign = -6

# VUS sub-tiers. The ACMG 2026 statement describes them in words but says the
# point ranges will come with the revised standards (SVCv4.0, not yet
# published). So no numeric cut-offs are set here. Add min_points to every
# tier when official ranges exist, and the program will start using them
# (the loader checks that the ranges are different and cover the VUS range).
# Two different papers describe the tiers, so each description keeps its own
# paper's wording. VUS-high and VUS-mid follow the ACMG 2026 statement, whose
# full text was not read (paywalled). VUS-low follows Bennett 2025.
[[vus_tiers]]
name = "VUS-high"
description = "The upper part of the VUS range, bordering Likely Pathogenic. Most likely to be reclassified upward."
source = "mighton2026"

[[vus_tiers]]
name = "VUS-mid"
description = "Equivocal evidence: balanced, conflicting, or absent."
source = "mighton2026"

[[vus_tiers]]
name = "VUS-low"
description = "Bennett 2025: the evidence may be benign but is not enough for Likely benign. In the four laboratories they studied, no variant at this level was later reclassified to Likely pathogenic or Pathogenic."
source = "bennett2025"

# Criteria that cannot both be true. While both are applied the program shows no
# class, because adding contradictory evidence together would change the class
# (the 2015 paper says contradictory evidence gives VUS).
[[exclusive_pairs]]
a = "PP3"
b = "BP4"
reason = "Both rest on computational predictions. Computational evidence points one way, not both."
source = "richards2015"

[[exclusive_pairs]]
a = "PS1"
b = "PM5"
reason = "Both compare with a known pathogenic variant at the same amino acid. Use the stronger one that fits, not both."
source = "richards2015"

[[exclusive_pairs]]
a = "PM2"
b = "BA1"
reason = "Absent from population data and more than 5% frequency cannot both be true."
source = "richards2015"

[[exclusive_pairs]]
a = "PM2"
b = "BS1"
reason = "Absent from population data and more frequent than expected cannot both be true."
source = "richards2015"

[[exclusive_pairs]]
a = "PVS1"
b = "PM4"
reason = "PM4 should not be applied to a variant that also has PVS1 at any strength, because it counts the same change twice."
source = "abou-tayoun2018"

[[exclusive_pairs]]
a = "PS3"
b = "BS3"
reason = "Functional studies cannot both show damage and show no damage."
source = "richards2015"

# Two criteria that may both apply, but not both at a high strength. The limit is
# in this program's points. ClinGen limits phenotype (PP4) and co-segregation
# (PP1) together at 5 points: the strongest allowed pair is Strong + Supporting.
# Two Strong answers (8 points) are not allowed for the pair. The [locus_evidence]
# helper offers only strength choices that keep the pair within this limit. A
# choice made by hand can still go over it, and then the program withholds the
# class rather than silently lowering a strength.
[[combination_caps]]
a = "PP1"
b = "PP4"
max_points = 5
reason = "ClinGen's 2024 guidance allows PP1_Strong + PP4_Supporting, but not PP1_Strong + PP4_Strong or Strong + Moderate."
source = "clingen-pp1-pp4-2024"

# Pejaver 2022 recommends limiting the sum of PP3 and PM1 to Strong (4 points here).
[[combination_caps]]
a = "PM1"
b = "PP3"
max_points = 4
reason = "Pejaver 2022 recommends that the evidence strength of PP3 and PM1 together does not go above Strong."
source = "pejaver2022"

# ---------------------------------------------------------------------------
# Prediction tools calibrated by Pejaver 2022 (Table 2). `at` is the score limit
# for each strength: for pathogenic a score at or above it reaches that strength,
# for benign a score at or below it does. Listed weakest first. A score between
# the weakest benign and weakest pathogenic limit supports neither PP3 nor BP4.
# Only the four tools the paper names as able to reach Strong for pathogenicity
# and Moderate for benignity are included. The program lowers a published level
# to the criterion's limit (BP4 stops at Moderate), and says so on screen.
# These numbers were read from the open-access paper on 2026-11-04 and must be
# checked by a reviewer. The paper's own caveat: pick one tool, and pick it
# before looking at its result.
# ---------------------------------------------------------------------------
[[predictors]]
id = "revel"
name = "REVEL"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.644 }, { strength = "moderate", at = 0.773 }, { strength = "strong", at = 0.932 }]
benign = [{ strength = "supporting", at = 0.290 }, { strength = "moderate", at = 0.183 }, { strength = "strong", at = 0.016 }, { strength = "very_strong", at = 0.003 }]

[[predictors]]
id = "bayesdel-noaf"
name = "BayesDel (no allele frequency)"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
note = "Only the version without minor allele frequency was calibrated. Do not use the version with it."
pathogenic = [{ strength = "supporting", at = 0.13 }, { strength = "moderate", at = 0.27 }, { strength = "strong", at = 0.50 }]
benign = [{ strength = "supporting", at = -0.18 }, { strength = "moderate", at = -0.36 }]

[[predictors]]
id = "mutpred2"
name = "MutPred2"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.737 }, { strength = "moderate", at = 0.829 }, { strength = "strong", at = 0.932 }]
benign = [{ strength = "supporting", at = 0.391 }, { strength = "moderate", at = 0.197 }, { strength = "strong", at = 0.010 }]

[[predictors]]
id = "vest4"
name = "VEST4"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.764 }, { strength = "moderate", at = 0.861 }, { strength = "strong", at = 0.965 }]
benign = [{ strength = "supporting", at = 0.449 }, { strength = "moderate", at = 0.302 }]

# SpliceAI (Walker 2023, Table 1). The paper calibrated these limits to Moderate
# evidence but advises applying PP3 and BP4 at Supporting only, so no higher level
# is listed; `calibrated` records the difference for the screen and the saved reason.
# Scores above 0.1 and below 0.2 give no evidence. The paper's table is for the
# maximum SpliceAI delta score, so the helper accepts only 0 to 1 and asks the
# curator to confirm the variant is outside donor/acceptor +/-1,2 before applying.
# The limits were read from the open-access paper on 2026-11-07 (two fetches, then
# the full page text downloaded with curl, which matched). A reviewer must still
# check them.
[[predictors]]
id = "spliceai"
name = "SpliceAI"
source = "walker2023"
reference = "Walker 2023, Table 1"
calibrated = "moderate"
min_score = 0.0
max_score = 1.0
eligibility = "the variant is outside the donor and acceptor +/-1,2 positions"
note = "Enter the maximum SpliceAI delta score (the paper's Table 1 is for that value). For variants outside the donor and acceptor +/-1,2 positions only; those positions go through the PVS1 guide. The paper applies this at Supporting even though it calibrated it to Moderate. If splicing data later raise the variant to PVS1, remove PP3 and BP4 (do not count both)."
pathogenic = [{ strength = "supporting", at = 0.2 }]
benign = [{ strength = "supporting", at = 0.1 }]

# ---------------------------------------------------------------------------
# Criteria. strength is the default strength from the 2015 paper unless a
# note says a later recommendation changed it. The user may change the
# strength in the app, up to max_strength; the program shows the change.
#
# max_strength is a cautious safeguard chosen for this program, NOT a limit
# published by ACMG/AMP or ClinGen, and a reviewer should check every one. Its
# job is to stop weak evidence being raised until it alone gives a confident
# class. No criterion that is Supporting by default can reach Very Strong.
# Criteria with no limit (PVS1, PS2, PS3) have a published route to Very Strong.
# PP5 and BP6 have none because they are not counted today. A gene-specific rule
# set may allow more: edit a copy of this file and load it with --rules. The
# limits do not apply to earlier records, which are read as they were made.
#
# Benign criteria offer Supporting, Moderate and Strong; the 2015 table has no
# Very Strong benign row, and BA1 has only its single stand-alone level.
#
# [[criteria.guide]] lists the situations that set a criterion's strength. When
# a criterion has a guide, the curator answers it instead of getting the default.
# Each answer needs a stable id (saved in the case file), a short label for the
# collapsed row and the screen reader, and the full situation text. Keep the id
# unchanged when you reword; change the rule-set version if the meaning changes.
# ---------------------------------------------------------------------------

# ----- Pathogenic -----

[[criteria]]
code = "PVS1"
direction = "pathogenic"
strength = "very_strong"
category = "variant_type"
title = "Null variant in a loss-of-function gene"
summary = "A variant that is expected to remove the gene's function (nonsense, frameshift, canonical +/-1 or 2 splice site, initiation codon, or single-exon or multi-exon deletion) in a gene where loss of function is a known disease mechanism."
source = "richards2015"
note = "Very Strong is the 2015 strength and fits the clearest case only. The ClinGen decision tree (Abou Tayoun 2018) gives lower strengths or no PVS1 at all in many other cases, so this program asks what kind of variant it is instead of assuming Very Strong. For a canonical splice variant, consider both exon skipping and cryptic splice sites, and use the lowest strength among the scenarios; do not also apply PP3 for the splicing prediction. The list here is a shortened form of the tree, so read the paper for a difficult case."
guide_source = "abou-tayoun2018"

[[criteria.guide]]
id = "nmd"
short = "NMD predicted"
situation = "Nonsense or frameshift variant, or a canonical splice variant, exon deletion or proven partial tandem duplication that shifts the reading frame: decay (NMD) is predicted, and the exon is in the biologically relevant transcripts."
strength = "very_strong"

[[criteria.guide]]
id = "whole_gene_deletion"
short = "Whole-gene deletion"
situation = "Whole-gene deletion, where loss of function is an established disease mechanism. Abou Tayoun 2018 says a full-gene deletion of a known haploinsufficient gene warrants Pathogenic even though PVS1 alone is 8 points, so check the rest of the evidence."
strength = "very_strong"

[[criteria.guide]]
id = "last_exon_critical"
short = "Last exon, critical region"
situation = "Decay is not predicted (for example a stop in the last exon), and the removed region is critical to the protein: pathogenic variants lie downstream of the new stop."
strength = "strong"

[[criteria.guide]]
id = "over_10_percent"
short = ">10% of protein removed"
situation = "Decay is not predicted, the role of the removed region is not established, and more than 10% of the protein is removed."
strength = "strong"

[[criteria.guide]]
id = "tandem_unknown"
short = "Tandem duplication, unknown site"
situation = "Duplication with an unknown insertion site that would shift the reading frame and cause decay if it is in tandem."
strength = "strong"

[[criteria.guide]]
id = "under_10_percent"
short = "<10% of protein removed"
situation = "Decay is not predicted, the role of the removed region is not established, and less than 10% of the protein is removed."
strength = "moderate"

[[criteria.guide]]
id = "start_loss_upstream"
short = "Start-loss, variant upstream"
situation = "Start-loss, no transcript uses an alternative start codon, and one or more pathogenic variants lie before the next in-frame methionine."
strength = "moderate"

[[criteria.guide]]
id = "start_loss_none"
short = "Start-loss, none upstream"
situation = "Start-loss, no transcript uses an alternative start codon, and no pathogenic variants lie before the next in-frame methionine."
strength = "supporting"

[[criteria.guide]]
id = "not_applicable"
short = "Does not apply"
situation = "The exon is missing from the biologically relevant transcripts or is enriched for common loss-of-function variants; a start-loss where a transcript uses an alternative start codon; a whole-gene tandem duplication or one inserted outside the gene; or a duplication where decay is unlikely or unknown."

[[criteria]]
code = "PS1"
direction = "pathogenic"
strength = "strong"
max_strength = "strong"
category = "variant_type"
title = "Same amino acid change as a known pathogenic variant"
summary = "The same amino acid change, caused by a different nucleotide change, is already established as pathogenic."
source = "richards2015"

[[criteria]]
code = "PS2"
direction = "pathogenic"
strength = "strong"
category = "family_cases"
title = "Confirmed de novo"
summary = "The variant arose new in a patient with the disease and no family history, with maternity and paternity confirmed."
source = "richards2015"
note = "ClinGen SVI v1.1 weighs de novo evidence by points per patient (how well the phenotype fits, and whether the parental relationships were confirmed). Use the De novo helper in the criteria list: 0.5, 1, 2 or 4 points give Supporting, Moderate, Strong or Very Strong. The strength here is the generic 2015 default. Not built: the X-linked and mosaicism rules, which are shown as notes."

# ---------------------------------------------------------------------------
# Functional evidence (Brnich 2019), for PS3 (damage) and BS3 (no damage).
# Without a statistical analysis the number of validation controls decides: an
# assay with at least 11 controls (a mix of pathogenic and benign variants)
# reaches Moderate; one with 1 to 10 reaches Supporting; one with no controls
# gives no evidence (Brnich's Supporting level assumes experimental controls;
# a reviewer should confirm the minimum of 1). With an OddsPath calculation the
# value decides, and each limit is crossed strictly: above 2.1, 4.3, 18.7 and
# 350 gives PS3 at Supporting, Moderate, Strong and Very Strong; below 0.48,
# 0.23 and 0.053 gives BS3 at Supporting, Moderate and Strong. Values from 0.48
# to 2.1 are indeterminate. The paper also says that even Very Strong functional
# evidence is not enough alone for a Pathogenic class. The program does not
# enforce that; the screen repeats it. Numbers read from the open-access paper
# (PMC6938631) on 2026-11-04; a reviewer must check them.
# ---------------------------------------------------------------------------
[functional]
source = "brnich2019"
controls_supporting_min = 1
controls_moderate_min = 11
pathogenic = [{ strength = "supporting", at = 2.1 }, { strength = "moderate", at = 4.3 }, { strength = "strong", at = 18.7 }, { strength = "very_strong", at = 350.0 }]
benign = [{ strength = "supporting", at = 0.48 }, { strength = "moderate", at = 0.23 }, { strength = "strong", at = 0.053 }]

# ---------------------------------------------------------------------------
# Co-segregation (PP1) and phenotype specificity (PP4), ClinGen 2024. The paper
# scores both in points that can be fractions (0.4, 1.5), then limits the two
# together to 5 points and maps the total to strengths in its Table 4. This
# program counts whole points per strength, so the helper only does the paper's
# arithmetic and lists the Table 4 strength choices; the curator picks one.
#   pp4_yield:    Table 2. A diagnostic yield (percent) at or above `at` earns
#                 `points`; a yield between two rows rounds down to the lower row.
#                 When several variants lie on one allele, the paper divides the
#                 YIELD (a probability) among them and then reads this table; it
#                 says one must not divide the points ("that would be
#                 mathematically incorrect"). Its example: a 95.8% yield shared by
#                 two variants is 47.9% each, which is 2.5 points each.
#   yield_text_minimum: the paper's text says PP4 needs a yield "over 20%", but its
#                 Table 2 gives 1 point at 19.1%. The table is followed, and the
#                 screen warns for a yield below this value. A reviewer should
#                 decide whether to start at 20 instead.
#   segregation:  Table 3. Points for each informative co-segregation. The
#                 paper's table stops at five; it says to keep adding for an
#                 autosomal-recessive unaffected relative, and the total is
#                 capped anyway, so a straight multiple matches every row.
#   cap_points:   the limit for PP1 and PP4 together. The loader requires the
#                 PP1/PP4 combination cap to be the same number, and the standard
#                 point scale (Supporting 1, Moderate 2, Strong 4), because Table 4
#                 is written in those points.
#   bands:        Table 4. From `min_points` upwards (and below the next band) the
#                 paper allows these strengths. Each option is one allowed choice.
#                 The loader checks that no option is worth more program points
#                 than the band's lower edge.
#   homogeneity_text: when only one gene can cause the phenotype (locus
#                 homogeneity) the paper says not to use segregation to support
#                 pathogenicity, so PP1 is not counted and only PP4 is offered.
#   notes:        cautions for PP4 from the paper, shown with the helper.
# Numbers read from the open-access paper (PMC10806742) on 2026-11-04 and
# 2026-11-05 and agreed each time; a reviewer must still check them. Not built in:
# sharing PP1 points among several variants on one allele (the paper gives a
# worksheet, its Table S1, which was not available); the helper refuses PP1 when
# more than one variant shares the allele. BS4 has its own table below.
# ---------------------------------------------------------------------------
[locus_evidence]
source = "clingen-pp1-pp4-2024"
cap_points = 5.0
yield_text_minimum = 20.0
homogeneity_text = "If only this gene can cause the phenotype (locus homogeneity), the paper says that co-segregation cannot be counted as evidence beyond the phenotype points, and not to use segregation to support pathogenicity. PP1 is not counted; use PP4 only."
notes = [
