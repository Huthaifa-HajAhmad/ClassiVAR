# Points per evidence strength (magnitude). Pathogenic evidence adds this many
# points, benign evidence subtracts it. "stand_alone" is only used by BA1 and
# is treated here as equal to very strong benign evidence (8 points). That
# equality is this file's own modelling choice, not a value from Tavtigian 2020,
# which has no stand-alone level. It makes BA1 alone reach Benign (-8 <= -7).
# The program also enforces the stronger rule from Richards 2015: while BA1 is
# applied the class is Benign, unless pathogenic evidence also reaches a rule on
# its own. That last case is withheld, because a known pathogenic variant can be
# common (the reason ClinGen keeps a BA1 exception list).
[points]
supporting = 1
moderate = 2
strong = 4
very_strong = 8
stand_alone = 8

# Lowest total points for each class. Anything below likely_benign is Benign.
# Source: tavtigian2020 (to be verified by the reviewer).
[class_min_points]
pathogenic = 10
likely_pathogenic = 6
vus = 0
likely_benign = -6

# VUS sub-tiers. The ACMG 2026 statement describes them in words but says the
# point ranges will come with the revised standards (SVCv4.0, not yet
# published). So no numeric cut-offs are set here. Add min_points to every
# tier when official ranges exist, and the program will start using them
# (the loader checks that the ranges are different and cover the VUS range).
# Two different papers describe the tiers, so each description keeps its own
# paper's wording. VUS-high and VUS-mid follow the ACMG 2026 statement, whose
# full text was not read (paywalled). VUS-low follows Bennett 2025.
[[vus_tiers]]
name = "VUS-high"
description = "The upper part of the VUS range, bordering Likely Pathogenic. Most likely to be reclassified upward."
source = "mighton2026"

[[vus_tiers]]
name = "VUS-mid"
description = "Equivocal evidence: balanced, conflicting, or absent."
source = "mighton2026"

[[vus_tiers]]
name = "VUS-low"
description = "Bennett 2025: the evidence may be benign but is not enough for Likely benign. In the four laboratories they studied, no variant at this level was later reclassified to Likely pathogenic or Pathogenic."
source = "bennett2025"

# Criteria that cannot both be true. While both are applied the program shows no
# class, because adding contradictory evidence together would change the class
# (the 2015 paper says contradictory evidence gives VUS).
[[exclusive_pairs]]
a = "PP3"
b = "BP4"
reason = "Both rest on computational predictions. Computational evidence points one way, not both."
source = "richards2015"

[[exclusive_pairs]]
a = "PM2"
b = "BA1"
reason = "Absent from population data and more than 5% frequency cannot both be true."
source = "richards2015"

[[exclusive_pairs]]
a = "PM2"
b = "BS1"
reason = "Absent from population data and more frequent than expected cannot both be true."
source = "richards2015"

[[exclusive_pairs]]
a = "PVS1"
b = "PM4"
reason = "PM4 should not be applied to a variant that also has PVS1 at any strength, because it counts the same change twice."
source = "abou-tayoun2018"

[[exclusive_pairs]]
a = "PS3"
b = "BS3"
reason = "Functional studies cannot both show damage and show no damage."
source = "richards2015"

# Two criteria that may both apply, but not both at a high strength. The limit is
# in this program's points. ClinGen limits phenotype (PP4) and co-segregation
# (PP1) together at 5 points: the strongest allowed pair is Strong + Supporting.
# Two Strong answers (8 points) are not allowed for the pair. The [locus_evidence]
# helper offers only strength choices that keep the pair within this limit. A
# choice made by hand can still go over it, and then the program withholds the
# class rather than silently lowering a strength.
[[combination_caps]]
a = "PP1"
b = "PP4"
max_points = 5
reason = "ClinGen's 2024 guidance allows PP1_Strong + PP4_Supporting, but not PP1_Strong + PP4_Strong or Strong + Moderate."
source = "clingen-pp1-pp4-2024"

# Pejaver 2022 recommends limiting the sum of PP3 and PM1 to Strong (4 points here).
[[combination_caps]]
a = "PM1"
b = "PP3"
max_points = 4
reason = "Pejaver 2022 recommends that the evidence strength of PP3 and PM1 together does not go above Strong."
source = "pejaver2022"

# ---------------------------------------------------------------------------
# Prediction tools calibrated by Pejaver 2022 (Table 2). `at` is the score limit
# for each strength: for pathogenic a score at or above it reaches that strength,
# for benign a score at or below it does. Listed weakest first. A score between
# the weakest benign and weakest pathogenic limit supports neither PP3 nor BP4.
# Only the four tools the paper names as able to reach Strong for pathogenicity
# and Moderate for benignity are included. The program lowers a published level
# to the criterion's limit (BP4 stops at Moderate), and says so on screen.
# These numbers were read from the open-access paper on 2026-11-04 and must be
# checked by a reviewer. The paper's own caveat: pick one tool, and pick it
# before looking at its result.
# ---------------------------------------------------------------------------
[[predictors]]
id = "revel"
name = "REVEL"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.644 }, { strength = "moderate", at = 0.773 }, { strength = "strong", at = 0.932 }]
benign = [{ strength = "supporting", at = 0.290 }, { strength = "moderate", at = 0.183 }, { strength = "strong", at = 0.016 }, { strength = "very_strong", at = 0.003 }]

[[predictors]]
id = "bayesdel-noaf"
name = "BayesDel (no allele frequency)"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
note = "Only the version without minor allele frequency was calibrated. Do not use the version with it."
pathogenic = [{ strength = "supporting", at = 0.13 }, { strength = "moderate", at = 0.27 }, { strength = "strong", at = 0.50 }]
benign = [{ strength = "supporting", at = -0.18 }, { strength = "moderate", at = -0.36 }]

[[predictors]]
id = "mutpred2"
name = "MutPred2"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.737 }, { strength = "moderate", at = 0.829 }, { strength = "strong", at = 0.932 }]
benign = [{ strength = "supporting", at = 0.391 }, { strength = "moderate", at = 0.197 }, { strength = "strong", at = 0.010 }]

[[predictors]]
id = "vest4"
name = "VEST4"
source = "pejaver2022"
reference = "Pejaver 2022, Table 2"
pathogenic = [{ strength = "supporting", at = 0.764 }, { strength = "moderate", at = 0.861 }, { strength = "strong", at = 0.965 }]
benign = [{ strength = "supporting", at = 0.449 }, { strength = "moderate", at = 0.302 }]

# AlphaMissense and VARITY_R (Bergquist 2025, Table 1), calibrated the same way
# as the four tools above. Table 1 also gives 3-point intervals, a level the
# 2015 framework does not have; here they count at the level below (Moderate),
# as the REVEL row above already does. ESM1b is in the same table but runs the
# other way (lower scores are more damaging), which this table cannot express
# yet, so it is not listed. Read from the paper's PDF on 2026-11-21; its rows for
# REVEL, MutPred2 and VEST4 match the Pejaver 2022 rows above.
[[predictors]]
id = "alphamissense"
name = "AlphaMissense"
source = "bergquist2025"
reference = "Bergquist 2025, Table 1"
note = "The developers' own cut-off (0.564) does not reach even Supporting evidence. Scores from 0.972 to 0.989 are the paper's 3-point level and count as Moderate here."
pathogenic = [{ strength = "supporting", at = 0.792 }, { strength = "moderate", at = 0.906 }, { strength = "strong", at = 0.990 }]
benign = [{ strength = "supporting", at = 0.169 }, { strength = "moderate", at = 0.099 }]

[[predictors]]
id = "varity-r"
name = "VARITY_R"
source = "bergquist2025"
reference = "Bergquist 2025, Table 1"
note = "Use VARITY_R, the model trained on rare variants only. Scores from 0.915 to 0.964 are the paper's 3-point level and count as Moderate here."
pathogenic = [{ strength = "supporting", at = 0.675 }, { strength = "moderate", at = 0.842 }, { strength = "strong", at = 0.965 }]
benign = [{ strength = "supporting", at = 0.251 }, { strength = "moderate", at = 0.116 }, { strength = "strong", at = 0.036 }]

# SpliceAI (Walker 2023, Table 1). The paper calibrated these limits to Moderate
# evidence but advises applying PP3 and BP4 at Supporting only, so no higher level
# is listed; `calibrated` records the difference for the screen and the saved reason.
# Scores above 0.1 and below 0.2 give no evidence. The paper's table is for the
# maximum SpliceAI delta score, so the helper accepts only 0 to 1 and asks the
# curator to confirm the variant is outside donor/acceptor +/-1,2 before applying.
# The limits were read from the open-access paper on 2026-11-07 (two fetches, then
# the full page text downloaded with curl, which matched). A reviewer must still
# check them.
[[predictors]]
id = "spliceai"
name = "SpliceAI"
source = "walker2023"
reference = "Walker 2023, Table 1"
calibrated = "moderate"
min_score = 0.0
max_score = 1.0
eligibility = "the variant is outside the donor and acceptor +/-1,2 positions"
note = "Enter the maximum SpliceAI delta score (the paper's Table 1 is for that value). For variants outside the donor and acceptor +/-1,2 positions only; those positions go through the PVS1 guide. The paper applies this at Supporting even though it calibrated it to Moderate. If splicing data later raise the variant to PVS1, remove PP3 and BP4 (do not count both). For a missense variant, Walker 2023 says PP3 may still come from a missense tool; Pejaver 2022 did not evaluate combining missense and splicing tools. PP3 is one code: apply it once, from the evidence that fits."
pathogenic = [{ strength = "supporting", at = 0.2 }]
benign = [{ strength = "supporting", at = 0.1 }]

# ---------------------------------------------------------------------------
# Criteria. strength is the default strength from the 2015 paper unless a
# note says a later recommendation changed it. The user may change the
# strength in the app, up to max_strength; the program shows the change.
#
# max_strength is the highest strength a cited, general (not gene-specific)
# source supports for the criterion: usually the 2015 strength, higher only
# where a later ClinGen recommendation gives a route (PM3, PP1, PP3, PP4, BP4,
# BP7). A typed reason cannot go above it. An expert panel's gene-specific rules
# may allow more: load such a rule file (Rules... in the app, or --rules).
# Criteria with no limit (PVS1, PS2, PS3, PM6) have a published route to Very
# Strong. PP5 and BP6 have none because they are not counted today. `levels`
# lists the exact choices when the published levels have a gap (BP7). The
# limits do not apply to earlier records, which are read as they were made.
# The test `no_criterion_can_be_raised_above_its_published_ceiling` names the
# source for each limit.
#
# Benign criteria offer Supporting, Moderate and Strong; the 2015 table has no
# Very Strong benign row, and BA1 has only its single stand-alone level.
#
# [[criteria.guide]] lists the situations that set a criterion's strength. When
# a criterion has a guide, the curator answers it instead of getting the default.
# Each answer needs a stable id (saved in the case file), a short label for the
# collapsed row and the screen reader, and the full situation text. Keep the id
# unchanged when you reword; change the rule-set version if the meaning changes.
# ---------------------------------------------------------------------------

# ----- Pathogenic -----

[[criteria]]
code = "PVS1"
direction = "pathogenic"
strength = "very_strong"
category = "variant_type"
title = "Null variant in a loss-of-function gene"
summary = "A variant that is expected to remove the gene's function (nonsense, frameshift, canonical +/-1 or 2 splice site, initiation codon, or single-exon or multi-exon deletion) in a gene where loss of function is a known disease mechanism."
source = "richards2015"
note = "Very Strong is the 2015 strength and fits the clearest case only. The ClinGen decision tree (Abou Tayoun 2018) gives lower strengths or no PVS1 at all in many other cases, so this program asks what kind of variant it is instead of assuming Very Strong. Richards 2015 requires that null variants are a known disease mechanism for this gene and inheritance: for example, a heterozygous nonsense variant in MYH7 is not pathogenic for dominant hypertrophic cardiomyopathy on that evidence alone. For a canonical splice variant, consider both exon skipping and cryptic splice sites, and use the lowest strength among the scenarios; check that no strong splice site within 20 nucleotides could restore in-frame splicing; do not also apply PP3 for the splicing prediction. The list here is a shortened form of the tree, so read the paper for a difficult case."
guide_source = "abou-tayoun2018"
gene_level_source = "abou-tayoun2018"

[[criteria.guide]]
id = "nmd"
short = "NMD predicted"
situation = "Nonsense or frameshift variant, or a canonical splice variant, exon deletion or proven partial tandem duplication that shifts the reading frame: decay (NMD) is predicted, and the exon is in the biologically relevant transcripts. NMD is predicted unless the new stop is in the last exon or in the last 50 nucleotides of the second-to-last exon."
strength = "very_strong"

[[criteria.guide]]
id = "whole_gene_deletion"
short = "Whole-gene deletion"
situation = "Whole-gene deletion, where loss of function is an established disease mechanism. This is a copy-number question: classify copy-number variants with the ACMG/ClinGen CNV points (Riggs 2020), which this program does not build. Here PVS1 alone gives Likely pathogenic, while Abou Tayoun 2018 says such a deletion of a known haploinsufficient gene warrants Pathogenic."
strength = "very_strong"

[[criteria.guide]]
id = "last_exon_critical"
short = "Last exon, critical region"
situation = "Decay is not predicted (for example a stop in the last exon), or exon skipping, a cryptic splice site or an exon deletion keeps the reading frame, and the removed or changed region is critical to the protein (for example, pathogenic variants lie in it)."
strength = "strong"

[[criteria.guide]]
id = "over_10_percent"
short = ">10% of protein removed"
situation = "Decay is not predicted, the role of the removed region is not established, and more than 10% of the protein is removed. The same applies to an in-frame change from exon skipping, a cryptic splice site or an exon deletion."
strength = "strong"

[[criteria.guide]]
id = "tandem_unknown"
short = "Tandem duplication, unknown site"
situation = "Duplication with an unknown insertion site that would shift the reading frame and cause decay if it is in tandem."
strength = "strong"

[[criteria.guide]]
id = "under_10_percent"
short = "<10% of protein removed"
situation = "Decay is not predicted, the role of the removed region is not established, and less than 10% of the protein is removed. The same applies to an in-frame change from exon skipping, a cryptic splice site or an exon deletion."
strength = "moderate"

[[criteria.guide]]
id = "start_loss_upstream"
short = "Start-loss, variant upstream"
situation = "Start-loss, no transcript uses an alternative start codon, and one or more pathogenic variants lie before the next in-frame methionine."
strength = "moderate"

[[criteria.guide]]
id = "start_loss_none"
short = "Start-loss, none upstream"
situation = "Start-loss, no transcript uses an alternative start codon, and no pathogenic variants lie before the next in-frame methionine."
strength = "supporting"

[[criteria.guide]]
id = "not_applicable"
short = "Does not apply"
situation = "The exon is missing from the biologically relevant transcripts or is enriched for common loss-of-function variants; a start-loss where a transcript uses an alternative start codon; a whole-gene tandem duplication or one inserted outside the gene; or a duplication where decay is unlikely or unknown."

# The gene-level question (Abou Tayoun 2018, Table 1, "Criteria for LoF disease
# mechanism"), asked before the guide. Its answer lowers the strength the guide
# gives. Readings of the table, made for this program and open to review: "more
# than 10%" (the table) rather than "at least 10%" (the text); a step that goes
# below Supporting means no PVS1; the step lowers whatever the flowchart gave,
# as the paper's examples do. Count only LoF variants in different exons, not
# in an alternatively spliced exon or one with an in-frame effect. A gene's own
# expert panel rule replaces this table ("a general framework until there is
# gene-level expert-curated mechanism information").
[[criteria.gene_level]]
id = "established"
short = "LoF mechanism established"
situation = "The gene-disease link is Strong or Definitive, 3 or more loss-of-function variants are Pathogenic without PVS1, and more than 10% of the variants that cause the phenotype are loss-of-function (across more than one exon; a single-exon gene is the exception). Follow the guide as it is."
steps = 0

[[criteria.gene_level]]
id = "lower_one"
short = "Lower one level"
situation = "The gene-disease link is at least Moderate, 2 or more loss-of-function variants have been seen with the phenotype (across more than one exon), and a null mouse model shows the phenotype. Lower the guide's strength by one level."
steps = 1

[[criteria.gene_level]]
id = "lower_two"
short = "Lower two levels"
situation = "The gene-disease link is at least Moderate, and only one of the last two conditions holds (2 or more loss-of-function variants with the phenotype, or a null mouse model that shows it). Lower the guide's strength by two levels."
steps = 2

[[criteria.gene_level]]
id = "no_lof_mechanism"
short = "No LoF mechanism"
situation = "There is no evidence that loss of function causes this disease (for example, only missense changes cause it). PVS1 does not apply at any strength."

[[criteria]]
code = "PS1"
direction = "pathogenic"
strength = "strong"
max_strength = "strong"
category = "variant_type"
title = "Same amino acid change as a known pathogenic variant"
summary = "The same amino acid change, caused by a different nucleotide change, is already established as pathogenic."
source = "richards2015"
note = "Both variants should have no predicted or known effect on splicing. Walker 2023 (Table 2) also lets PS1 capture the same predicted splicing effect as a known pathogenic or likely pathogenic variant, at a weight set by where the two variants lie: for a variant outside the donor/acceptor +/-1,2 positions with PP3, PS1 at the same nucleotide (PS1_Moderate if the known one is likely pathogenic), PS1_Moderate in the same splice motif (PS1_Supporting); for a +/-1,2 variant with PVS1, PS1_Supporting. Choose the lower strength in the menu and give the reason."

[[criteria]]
code = "PS2"
direction = "pathogenic"
strength = "strong"
category = "family_cases"
title = "Confirmed de novo"
summary = "The variant arose new in a patient with the disease and no family history, with maternity and paternity confirmed."
source = "richards2015"
note = "ClinGen SVI v1.1 weighs de novo evidence by points per patient (how well the phenotype fits, and whether the parental relationships were confirmed). Use the De novo helper in the criteria list: 0.5, 1, 2 or 4 points give Supporting, Moderate, Strong or Very Strong. The strength here is the generic 2015 default. Not built: the X-linked and mosaicism rules, which are shown as notes."

# ---------------------------------------------------------------------------
# Functional evidence (Brnich 2019), for PS3 (damage) and BS3 (no damage).
# Without a statistical analysis: an assay without normal and abnormal
# experimental controls and replicates gives no evidence; with them it reaches
# Supporting with "10 or fewer" validation controls (none included), and
# Moderate with at least 11 validation controls "including a mix of benign and
# pathogenic variants" (at least one of each here). With an OddsPath calculation the
# value decides, and each limit is crossed strictly: above 2.1, 4.3, 18.7 and
# 350 gives PS3 at Supporting, Moderate, Strong and Very Strong; below 0.48,
# 0.23 and 0.053 gives BS3 at Supporting, Moderate and Strong. Values from 0.48
# to 2.1 are indeterminate. The paper also says that even Very Strong functional
# evidence is not enough alone for a Pathogenic class. The program does not
# enforce that; the screen repeats it. Numbers read from the open-access paper
# (PMC6938631) on 2026-11-04; a reviewer must check them.
# ---------------------------------------------------------------------------
[functional]
source = "brnich2019"
controls_moderate_min = 11
pathogenic = [{ strength = "supporting", at = 2.1 }, { strength = "moderate", at = 4.3 }, { strength = "strong", at = 18.7 }, { strength = "very_strong", at = 350.0 }]
benign = [{ strength = "supporting", at = 0.48 }, { strength = "moderate", at = 0.23 }, { strength = "strong", at = 0.053 }]

# ---------------------------------------------------------------------------
# Co-segregation (PP1) and phenotype specificity (PP4), ClinGen 2024. The paper
# scores both in points that can be fractions (0.4, 1.5), then limits the two
# together to 5 points and maps the total to strengths in its Table 4. This
# program counts whole points per strength, so the helper only does the paper's
# arithmetic and lists the Table 4 strength choices; the curator picks one.
#   pp4_yield:    Table 2. A diagnostic yield (percent) at or above `at` earns
#                 `points`; a yield between two rows rounds down to the lower row.
#                 When several variants lie on one allele, the paper divides the
#                 YIELD (a probability) among them and then reads this table; it
#                 says one must not divide the points ("that would be
#                 mathematically incorrect"). Its example: a 95.8% yield shared by
#                 two variants is 47.9% each, which is 2.5 points each.
#   yield_text_minimum: the paper's text says PP4 needs a yield "over 20%", but its
#                 Table 2 gives 1 point at 19.1%. The table is followed, and the
#                 screen warns for a yield below this value. A reviewer should
#                 decide whether to start at 20 instead.
#   segregation:  Table 3. Points for each informative co-segregation. The
#                 paper's table stops at five; it says to keep adding for an
#                 autosomal-recessive unaffected relative, and the total is
#                 capped anyway, so a straight multiple matches every row.
#   cap_points:   the limit for PP1 and PP4 together. The loader requires the
#                 PP1/PP4 combination cap to be the same number, and the standard
#                 point scale (Supporting 1, Moderate 2, Strong 4), because Table 4
#                 is written in those points.
#   bands:        Table 4. From `min_points` upwards (and below the next band) the
#                 paper allows these strengths. Each option is one allowed choice.
#                 The loader checks that no option is worth more program points
#                 than the band's lower edge.
#   homogeneity_text: when only one gene can cause the phenotype (locus
#                 homogeneity) the paper says not to use segregation to support
#                 pathogenicity, so PP1 is not counted and only PP4 is offered.
#   notes:        cautions for PP4 from the paper, shown with the helper.
# Numbers read from the open-access paper (PMC10806742) on 2026-11-04 and
# 2026-11-05 and agreed each time; a reviewer must still check them. Not built in:
# sharing PP1 points among several variants on one allele (the paper gives a
# worksheet, its Table S1, which was not available); the helper refuses PP1 when
# more than one variant shares the allele. BS4 has its own table below.
# ---------------------------------------------------------------------------
[locus_evidence]
source = "clingen-pp1-pp4-2024"
cap_points = 5.0
yield_text_minimum = 20.0
homogeneity_text = "If only this gene can cause the phenotype (locus homogeneity), the paper says that co-segregation cannot be counted as evidence beyond the phenotype points, and not to use segregation to support pathogenicity. PP1 is not counted; use PP4 only."
notes = [
  "The yield must come from testing comparable to this patient's test, for the same phenotype. The paper says the evidence depends on the phenotype matching.",
  "PP4 is for genes with definitive or strong gene-disease validity, not for new gene-disease claims.",
  "When many genes can cause the phenotype (high locus heterogeneity), use PP4 with caution.",
  "A family seen before counts as PP4 or PS4, not both.",
]
pp4_yield = [
  { at = 19.1, points = 1.0 }, { at = 25.4, points = 1.5 }, { at = 33.0, points = 2.0 }, { at = 41.5, points = 2.5 },
  { at = 50.6, points = 3.0 }, { at = 59.6, points = 3.5 }, { at = 68.0, points = 4.0 }, { at = 75.4, points = 4.5 },
  { at = 81.6, points = 5.0 }, { at = 86.4, points = 5.5 }, { at = 90.2, points = 6.0 }, { at = 93.0, points = 6.5 },
  { at = 95.0, points = 7.0 }, { at = 96.5, points = 7.5 }, { at = 97.5, points = 8.0 }, { at = 98.3, points = 8.5 },
  { at = 98.8, points = 9.0 }, { at = 99.2, points = 9.5 }, { at = 99.4, points = 10.0 }, { at = 99.6, points = 10.5 },
  { at = 99.7, points = 11.0 }, { at = 99.8, points = 11.5 }, { at = 99.9, points = 12.0 },
]
segregation = [
  { id = "dominant", label = "Autosomal dominant", points_each = 1.0, note = "Count affected relatives who carry the variant. The table also lists unaffected relatives: count an unaffected relative who does not carry the variant only if the disease is fully penetrant. For reduced penetrance the paper recommends counting affected relatives only. Do not count unaffected parents: they are used to establish phase." },
  { id = "x-linked-male", label = "X-linked recessive, male", points_each = 1.0, note = "Count affected males who carry the variant, and unaffected males who do not carry it, the latter only if the disease is fully penetrant. A female whose carrier status is certain (for example she has an affected brother or son) can count too, and extra segregations in obligate heterozygous females can be counted. Do not count unaffected parents." },
  { id = "recessive-affected", label = "Autosomal recessive, affected", points_each = 2.0, note = "Count affected relatives who have the same genotype as the patient." },
  { id = "recessive-unaffected", label = "Autosomal recessive, unaffected", points_each = 0.4, note = "Count unaffected relatives who did not inherit the patient's variants, only if the disease is fully penetrant. Do not count unaffected parents: they are used to establish phase." },
]
bands = [
  { min_points = 1.0, options = [{ pp1 = "supporting" }, { pp4 = "supporting" }] },
  { min_points = 2.0, options = [{ pp1 = "moderate" }, { pp4 = "moderate" }, { pp1 = "supporting", pp4 = "supporting" }] },
  { min_points = 3.0, options = [{ pp1 = "supporting", pp4 = "moderate" }, { pp1 = "moderate", pp4 = "supporting" }] },
  { min_points = 4.0, options = [{ pp1 = "strong" }, { pp4 = "strong" }, { pp1 = "moderate", pp4 = "moderate" }] },
  { min_points = 5.0, options = [{ pp1 = "strong", pp4 = "supporting" }, { pp1 = "supporting", pp4 = "strong" }] },
]

# ---------------------------------------------------------------------------
# Non-segregation (BS4), same ClinGen 2024 paper. It recommends -4.0 points for
# non-segregation in autosomal dominant, autosomal recessive (patient homozygous)
# and X-linked disease. That is Strong benign in this program's points, which is
# already BS4's default strength, so no number changes. The paper says it has not
# formally measured this strength and keeps the earlier one. What the paper adds
# is the conditions: when non-segregation is not evidence. Each situation below
# says whether BS4 applies; the helper applies `strength` only for those that do.
# Read from the open-access paper (PMC10806742, Europe PMC copy) on 2026-11-05 and
# agreeing with an earlier reading; a reviewer must check the wording. Not built:
# counting individuals (the paper gives no per-person BS4 table), and how to weigh
# BS4 against PP1 in one family (the text read does not say).
# ---------------------------------------------------------------------------
[non_segregation]
source = "clingen-pp1-pp4-2024"
strength = "strong"

[[non_segregation.situations]]
id = "follows-not"
label = "Does not follow the disease"
applies = true
text = "Autosomal dominant, X-linked, or autosomal recessive with the patient homozygous: the variant does not follow the disease in the family (non-segregation). The paper recommends -4 points, which is Strong for BS4. It has not formally measured this strength and keeps the earlier one. Count only family members whose status is certain."

[[non_segregation.situations]]
id = "compound-heterozygous"
label = "Recessive, compound heterozygous"
applies = false
text = "Autosomal recessive and the patient has two different variants (compound heterozygous). A relative who lacks one of them gives little to no evidence that the variant is not pathogenic, because only one of the two alleles is necessarily benign (ClinGen 2024). Do not apply BS4."

[[non_segregation.situations]]
id = "reduced-penetrance"
label = "Reduced penetrance, unaffected carriers"
applies = false
text = "The disease has reduced penetrance and only unaffected carriers were seen. An unaffected carrier is not evidence against the variant, because carriers may stay unaffected. The paper counts unaffected people only if the disease is fully penetrant. Its quick method then looks at affected people only, and it warns that this can miss evidence against pathogenicity; for low penetrance it points to formal linkage analysis. Do not apply BS4 from unaffected carriers."

[[non_segregation.situations]]
id = "high-phenocopy"
label = "Many look-alike cases (phenocopy)"
applies = false
text = "The disease has a high rate of phenocopy: people who have the same disease from another cause, for example colon cancer. The paper does not recommend its quick points method for such diseases and says valid segregation evidence needs formal segregation analysis. Do not use this helper."

[[non_segregation.situations]]
id = "conflicting-or-large"
label = "Conflicting results or a very large family"
applies = false
text = "The family results conflict with each other, or the family is very large or has a complex structure. The paper says to use formal linkage analysis in these cases, which needs statistical genetics expertise. Do not use this helper."

# ---------------------------------------------------------------------------
# De novo evidence (ClinGen SVI recommendation v1.1, approved 18 March 2018), for
# PS2 and PM6. Each patient with the variant new (de novo) earns points from how
# well the phenotype fits the gene (Table 1) and whether the parental
# relationships were confirmed. The points of all patients are added and read
# against Table 2: 0.5 Supporting, 1 Moderate, 2 Strong, 4 Very Strong. If the
# parents were not tested for parentage or for the variant, no points are given.
# The paper says its points are not the points of Tavtigian 2020. Recessive
# genes: a de novo variant with no second pathogenic or likely pathogenic variant
# found lowers the strength by one level. Table 1 marks the "high genetic
# heterogeneity" row with a note "maximum allowable value of 1 may contribute to
# overall score"; it is read here as: that row adds at most 1 point in total.
# That reading is a judgement; a reviewer must check it. The text was extracted
# from the PDF on 2026-11-05; a reviewer must compare the numbers with the paper.
# Table 2 lets either code carry each level: PS2_Supporting or PM6_Supporting,
# PS2_Moderate or PM6, PS2 or PM6_Strong, PS2_VeryStrong or PM6_VeryStrong. The
# helper offers both codes for the same total and the curator chooses; the paper
# does not say which to prefer. This program stops PM6 at Strong, so a total of 4
# points offered as PM6 is lowered to Strong (PS2 can carry Very Strong).
# Read again on 2026-11-07 from the PDF itself (v1.1, updated 5 May 2021),
# downloaded with curl: Table 1, Table 2 and the three extra rules match.
# Not built: the X-linked rule (an unaffected carrier mother can count) and the
# mosaicism rule (parentage must be confirmed) are notes only.
# ---------------------------------------------------------------------------
[de_novo]
source = "clingen-svi-de-novo"
recessive_text = "For a recessive condition, a de novo variant with no second pathogenic or likely pathogenic variant found lowers the strength by one level (ClinGen SVI v1.1)."
notes = [
  "The patient's phenotype must be consistent with the gene and disease. If it only partly fits, use a lower row.",
  "Confirmed means the parental relationships were confirmed (for example by testing). It does not mean the variant is confirmed de novo.",
  "If the parents were not tested for parentage or for the variant, give no points.",
  "Apparent germline mosaicism (several affected siblings, both parents negative): parentage must be confirmed before de novo evidence counts.",
  "X-linked condition: a variant de novo in an unaffected carrier mother can count if her family history fits (no other affected male relatives). This helper does not check that.",
  "The paper's points are not the points of Tavtigian 2020. The strength read from the total can be applied as PS2 or as PM6.",
]
thresholds = [
  { at = 0.5, strength = "supporting" },
  { at = 1.0, strength = "moderate" },
  { at = 2.0, strength = "strong" },
  { at = 4.0, strength = "very_strong" },
]
phenotypes = [
  { id = "highly-specific", label = "Phenotype highly specific for the gene", confirmed = 2.0, unconfirmed = 1.0 },
  { id = "consistent", label = "Consistent with the gene, not highly specific", confirmed = 1.0, unconfirmed = 0.5 },
  { id = "consistent-heterogeneous", label = "Consistent, not specific, and many genes can cause it", confirmed = 0.5, unconfirmed = 0.25, max_points = 1.0 },
  { id = "not-consistent", label = "Phenotype not consistent with the gene", confirmed = 0.0, unconfirmed = 0.0 },
]

[[criteria]]
code = "PS3"
direction = "pathogenic"
strength = "strong"
category = "functional"
title = "Functional studies show damage"
summary = "Well-established functional studies show a damaging effect on the gene or protein."
source = "richards2015"
note = "ClinGen's functional evidence framework (Brnich 2019) sets the strength from the assay: without statistics, at most Moderate by the number of validation controls; with an OddsPath calculation, up to Very Strong. Use the functional-evidence helper in the criteria list for those two routes. The paper's four steps (define the disease mechanism, judge the class of assay, judge this assay, then apply it to the variant) are for you to do first. Even Very Strong functional evidence is not enough alone for Pathogenic. The strength here is the generic 2015 default."

[[criteria]]
code = "PS4"
direction = "pathogenic"
strength = "strong"
max_strength = "strong"
category = "population"
title = "More common in affected people"
summary = "The prevalence of the variant in affected individuals is significantly increased compared with controls (odds ratio or relative risk above 5.0, with a confidence interval that does not include 1.0). For very rare variants, where case-control studies may not reach significance, seeing the variant in several unrelated patients with the same phenotype and never in controls can count as Moderate evidence."
source = "richards2015"

[[criteria]]
code = "PM1"
direction = "pathogenic"
strength = "moderate"
max_strength = "moderate"
category = "variant_type"
title = "Hot spot or critical domain"
summary = "The variant sits in a mutational hot spot or a well-established functional domain without benign variation."
source = "richards2015"

[[criteria]]
code = "PM2"
direction = "pathogenic"
strength = "supporting"
max_strength = "moderate"
original_strength = "moderate"
category = "population"
title = "Absent or extremely rare in population data"
summary = "Absent from controls in population databases (or at extremely low frequency for recessive disease)."
source = "clingen-svi-pm2"
strength_source = "clingen-svi-pm2"
note = "The 2015 paper gave this Moderate strength. The ClinGen SVI recommendation (4 Sept 2020) lowered it to Supporting. With Supporting strength, ClinGen added a combining rule: one Very Strong + one Supporting = Likely pathogenic (so PVS1 + PM2 stays Likely pathogenic). Gene-specific expert-panel rule sets set their own frequency limits (for example PALB2 and ATM differ), so check for one. The SVI working group was retired in April 2025; current guidance is at https://clinicalgenome.org/tools/clingen-variant-classification-guidance/."

[[criteria]]
code = "PM3"
direction = "pathogenic"
strength = "moderate"
max_strength = "very_strong"
category = "family_cases"
title = "In trans with a pathogenic or likely pathogenic variant (recessive)"
summary = "In an affected patient with a recessive disease, found on the other copy of the gene from a pathogenic or likely pathogenic variant."
source = "clingen-svi-pm3"
note = "Use the PM3 patients helper for ClinGen 2019 Tables 1 and 2. Very Strong is supported at 4 patient points. Check rarity, phase, independent classification of the other variant, and unrelated patients before counting. The default remains Moderate."

[[criteria]]
code = "PM4"
direction = "pathogenic"
strength = "moderate"
max_strength = "moderate"
category = "variant_type"
title = "Protein length change"
summary = "An in-frame deletion or insertion in a non-repeat region, or a stop-loss variant, changes the protein length."
source = "richards2015"

[[criteria]]
code = "PM5"
direction = "pathogenic"
strength = "moderate"
max_strength = "moderate"
category = "variant_type"
title = "New missense at a known pathogenic residue"
summary = "A new missense change at an amino acid where a different missense change is established as pathogenic."
source = "richards2015"

[[criteria]]
code = "PM6"
direction = "pathogenic"
strength = "moderate"
category = "family_cases"
title = "Assumed de novo"
summary = "Assumed to have arisen new, but maternity and paternity are not confirmed."
source = "richards2015"
note = "ClinGen SVI v1.1 combines the de novo criteria (PS2 and PM6) into one point scale; the De novo helper offers the total as PS2 or as PM6 (Table 2 allows either). The strength here is the generic 2015 default. Table 2 lists PM6 up to Very Strong, and this program follows it: the points already give an unconfirmed parentage half the weight of a confirmed one, so a second cap would count the same doubt twice."

[[criteria]]
code = "PP1"
direction = "pathogenic"
strength = "supporting"
max_strength = "strong"
category = "family_cases"
title = "Co-segregation with disease"
summary = "The variant travels with the disease in several affected family members, in a gene definitively known to cause the disease."
source = "richards2015"
strength_source = "clingen-pp1-pp4-2024"
note = "ClinGen's 2024 points guidance can raise this up to Strong when several family members share the variant and the disease. The same guidance caps PP1 and PP4 together at 5 points, so this program withholds the class when the pair exceeds it. The guidance also says that when only one gene can cause the phenotype (locus homogeneity), co-segregation is not evidence beyond the phenotype points, so PP1 does not apply then. Use the co-segregation and phenotype helper in the criteria list to turn the family and phenotype facts into the strengths the paper allows. The change in strength from a curator is shown."

[[criteria]]
code = "PP2"
direction = "pathogenic"
strength = "supporting"
max_strength = "supporting"
category = "variant_type"
title = "Missense in a gene where missense causes disease"
summary = "A missense variant in a gene with few benign missense variants, where missense changes are a common disease mechanism."
source = "richards2015"

[[criteria]]
code = "PP3"
direction = "pathogenic"
strength = "supporting"
category = "computational"
title = "Predictions support a damaging effect"
summary = "Computational evidence (conservation, predicted effect on the protein or on splicing) supports a damaging effect."
source = "richards2015"
strength_source = "pejaver2022"
max_strength = "strong"
note = "ClinGen later calibrated score thresholds for prediction tools (Pejaver 2022), which can raise this to Moderate or Strong for some tools and score ranges. Very Strong is not offered here. Use the predictor helper in the criteria list for REVEL, BayesDel (no allele frequency), MutPred2, VEST4 (Pejaver 2022), AlphaMissense, VARITY_R (Bergquist 2025) or SpliceAI (splicing, Walker 2023); for any other tool choose the strength from the published table yourself. Choose one tool before you see its result."

[[criteria]]
code = "PP4"
direction = "pathogenic"
strength = "supporting"
max_strength = "strong"
category = "phenotype"
title = "Highly specific phenotype"
summary = "The patient's features or family history are highly specific for a disease with a single genetic cause."
source = "richards2015"
strength_source = "clingen-pp1-pp4-2024"
note = "ClinGen's 2024 guidance links this criterion to how specific the phenotype is for the gene (the diagnostic yield of testing for it) and caps PP1 and PP4 together at 5 points. The program withholds the class when the pair exceeds that cap. Use the co-segregation and phenotype helper in the criteria list for the points and the strengths the paper allows."

[[criteria]]
code = "PP5"
direction = "pathogenic"
strength = "supporting"
category = "database"
title = "Reputable source says pathogenic"
summary = "A reputable source reports the variant as pathogenic, but the evidence is not available to review."
source = "clingen-svi-pp5-bp6"
discouraged = true
note = "ClinGen (2018) proposed that laboratories stop using PP5 and BP6 and removed them from its curation tool. ACMG/AMP made no formal recommendation to remove them, and some tools still apply them. In this program a new assessment lists this criterion but does not count it. Earlier records that used it are still counted, so their own class can be reproduced."


[pm3]
source = "clingen-svi-pm3"
notes = [
  "Count each unrelated affected patient once, for a recessive disorder. Both variants must meet the relevant PM2 rarity threshold; this helper does not check frequency.",
  "In trans means on different copies of the gene. Phase unknown means this has not been established. For uncertain second variants the default is 0.25 points only when confirmed in trans; unknown phase gives zero.",
  "For unknown phase, check that different pathogenic or likely pathogenic partner variants support the accumulated weight. This count-only helper cannot check partner identities.",
  "The other variant must be classified independently, without using the variant being assessed as evidence. Check gene-specific guidance; the uncertain-variant weight can depend on gene size.",
  "The numbers and row limits were read from the published Tables 1 and 2 on 2026-11-05; a reviewer must compare them with the paper.",
]
thresholds = [
  { strength = "supporting", at = 0.5 },
  { strength = "moderate", at = 1.0 },
  { strength = "strong", at = 2.0 },
  { strength = "very_strong", at = 4.0 },
]

[[pm3.rows]]
id = "confirmed"
label = "Pathogenic or likely pathogenic, confirmed in trans"
points = 1.0

[[pm3.rows]]
id = "unknown_p"
label = "Pathogenic, phase unknown"
points = 0.5

[[pm3.rows]]
id = "unknown_lp"
label = "Likely pathogenic, phase unknown"
points = 0.25

[[pm3.rows]]
id = "homozygous"
label = "Homozygous (same variant on both copies)"
points = 0.5
max_points = 1.0

[[pm3.rows]]
id = "uncertain"
label = "Uncertain second variant, confirmed in trans"
points = 0.25
max_points = 0.5

# ---------------------------------------------------------------------------
# Population frequency (BA1, BS1, PM2), for the Population frequency helper.
# BA1 (Ghosh 2018): above ba1_frequency in a continental population dataset of
# at least ba1_min_alleles observed alleles, unless the variant is on the BA1
# exception list below. BS1 (Whiffin 2017): the filtering allele frequency is at
# or above the disease's maximum credible frequency (dominant: prevalence x 1/2
# x allelic contribution / penetrance; recessive: sqrt(prevalence) x allelic
# contribution x sqrt(genetic contribution) / sqrt(penetrance)). The paper's
# printed dominant formula has no "x 1/2", but its worked example (HCM, 4.0e-5)
# uses it; the example is followed, and a reviewer should confirm. PM2 (ClinGen
# 2020): Supporting when absent; the recommendation gives no number for
# "extremely low frequency if recessive", so only a gene-specific limit is used.
# Read from the papers on 2026-11-21 (Whiffin's formulas from the page images).
# ---------------------------------------------------------------------------
[population]
ba1_source = "ghosh2018"
ba1_frequency = 0.05
ba1_min_alleles = 2000
bs1_source = "whiffin2017"
pm2_source = "clingen-svi-pm2"
notes = [
  "Use the filtering allele frequency (gnomAD FAF95, highest genetic ancestry group) for BS1: it is the lower bound of the 95% confidence interval, so chance does not lift a rare variant over the limit (Whiffin 2017).",
  "Population data for insertions and deletions may be poorly called by next-generation sequencing (Richards 2015, Table 3). Check the coverage and the call before you rely on absence.",
  "Founder populations (for example Ashkenazi Jewish or Finnish) can carry a pathogenic allele at high frequency (Ghosh 2018). Be careful when only one of them is above the limit.",
  "An expert panel may set gene-specific BA1, BS1 and PM2 limits. Enter them to use them instead of the general ones.",
]

