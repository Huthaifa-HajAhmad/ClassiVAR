# Rule set: ACMG/AMP 2015 criteria with the points scoring system.
#
# STATUS: DRAFT, UNVERIFIED. No qualified reviewer has checked this file. The
# builder compared parts of it with the sources on the web; [meta].note says
# what and when. That is not a line-by-line review of every entry. A qualified
# reviewer must verify every entry before the content is used for anything
# beyond research and learning.
#
# How to read this file:
#   [meta]           which rule set this is, and its review status
#   [[sources]]      the papers every rule points to (by id)
#   [points]         how many points each evidence strength is worth
#   [class_min_points]  the lowest total that still gives each class
#   [[vus_tiers]]    VUS sub-tiers. Numeric cut-offs are NOT published yet.
#   [[exclusive_pairs]] criteria that should not be used together
#   [[combination_caps]] two criteria that may be used together only up to a point total
#   [[predictors]]   score limits for prediction tools, for PP3 and BP4
#   [functional]     assay limits for PS3 and BS3 (controls and OddsPath)
#   [locus_evidence] PP1 and PP4 points, their joint limit, and the allowed strengths
#   [non_segregation] the situations in which BS4 does and does not apply
#   [de_novo]        PS2 points per patient, and the strength the total gives
#   [pm3]            recessive patient points (ClinGen 2019 Tables 1 and 2)
#   [[ba1_exceptions]] dated reference list (ClinGen July 2018), no automatic matching
#   [[criteria]]     the 28 ACMG/AMP criteria
#   [[facts]]        optional context questions (consequence, splicing) that add
#                    sourced hints to review steps without applying or scoring evidence
#   [[path]]         the guided review order: ten questions, each criterion once.
#                    It only orders the review; it changes no points, caps or classes.
#
# Changing a rule means editing this file. The program checks the file when it
# loads: every rule needs a source that exists in [[sources]].

[meta]
id = "acmg-amp-points"
name = "ACMG/AMP 2015 criteria, points scoring (draft)"
version = "0.14.0-draft"
status = "unverified"
note = "Draft. On 2026-11-03 the builder checked, against the sources on the web, the criteria wording (Richards 2015 Tables 3 and 4), the combining table (Table 5), the points and class thresholds (Tavtigian 2020, via its published summary), the PM2 recommendation (4 Sept 2020) and the PP5/BP6 recommendation (Biesecker and Harrison 2018). On 2026-11-04 an audit (docs/AUDIT-2026-11-04.md) found problems, and this version fixes them: PVS1 wording and strength guidance, the ClinGen 2020 combining addition, BP1 and PS4 wording, contradictory pairs now withhold the class, PP3 capped at Strong, discouraged criteria no longer counted. A later pass added the PVS1 situation guide, strength caps for weak evidence, PM4/PVS1 exclusivity, the PP1+PP4 combined cap, the BP4 Moderate ceiling, and saves the chosen PVS1 situation. Version 0.5.0 added the calibrated PP3/BP4 score limits for four tools (Pejaver 2022, Table 2) and the PM1+PP3 combined limit. Version 0.6.0 adds the functional-evidence limits for PS3/BS3 (Brnich 2019): the control-count route and the OddsPath limits. Version 0.7.0 adds the PP1/PP4 points arithmetic (ClinGen 2024, Tables 2 to 4) as a helper: points from diagnostic yield and from co-segregations, the 5 point limit, and the strength choices the paper allows. Version 0.8.0 adds a BS4 situation helper (same paper): BS4 stays Strong, and the helper applies it only where the paper supports it (not for compound heterozygotes, reduced penetrance with unaffected carriers, or high phenocopy rates). No points changed. The PP1/PP4 helper does not count PP1 when only one gene can cause the phenotype (the paper's locus homogeneity), and for several variants on one allele it divides the PP4 yield as the paper does and refuses PP1 (the paper's sharing worksheet is not built in). Version 0.9.0 adds a de novo helper for PS2 (ClinGen SVI recommendation v1.1, 2018): points per patient from how well the phenotype fits and whether the parents were confirmed, the total read as a strength (0.5, 1, 2 and 4 points for Supporting to Very Strong), and the paper's rule that a recessive gene with no second variant lowers the strength one level. No existing points or limits changed. Version 0.10.0 adds the PM3 patient points (ClinGen SVI v1.0, 2 May 2019) and raises its ceiling to Very Strong, correcting the earlier unsupported claim that no published route exists. It also adds the nine BA1 exceptions as a dated manual reference. Version 0.12.0 adds SpliceAI to the predictor table (Walker 2023, Table 1): the paper's calibrated Moderate evidence is recorded separately from the Supporting code it advises, and the helper accepts only 0-1 and asks the curator to confirm the variant is outside donor/acceptor +/-1,2. It also lets the de novo total be applied as PS2 or as PM6 (ClinGen SVI v1.1, Table 2), with PM6 still capped at Strong, and PS2 and PM6 together now raise a double-counting warning. No existing points or limits changed. Version 0.13.0 adds no numbers: the loader now refuses a strength guide on a criterion the app's helpers set (the helpers cannot answer one), and the engine flags PP4 and PS4 together as one family observation counted twice, like the PP1/PP4 caution ('not both'). Version 0.14.0 (2026-11-21, after the scientific audit in docs/AUDIT-2026-11-21-scientific.md): every max_strength is now the highest level a cited general source supports (PM1, PM4 and PM5 stop at Moderate; PP2, BP1, BP2, BP3 and BP5 at Supporting; BP7 offers Supporting or Strong (RNA) per Walker 2023, no Moderate); PM6 may reach Very Strong as SVI de novo Table 2 lists; BA1 uses the Ghosh 2018 wording (continental population, at least 2,000 alleles); the PVS1 guide states the NMD rule and the in-frame splicing branch (Abou Tayoun 2018) and points whole-gene deletions to the CNV framework (Riggs 2020); the PS1/PM5 pair is named as this program's safeguard. The ClinGen Evidence Repository benchmark (docs/review/BENCHMARK-erepo.md) then showed 8 expert panels applying PS1 and PM5 together, so that pair is now a double-counting caution rather than a contradiction, and BA1 is also withheld against pathogenic points that alone reach Likely pathogenic (PVS1 alone meets no 2015 row). The program's combining table (code, not this file) also gives two Very Strong criteria Pathogenic, from the Tavtigian 2020 points; see docs/ROADMAP.md. This is not a qualified review. Research and learning use only."

