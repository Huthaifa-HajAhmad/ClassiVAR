reviewer = "Claude (AI, claude-opus-5-5)"
kind = "ai"
date = "2026-11-21"
verdict = "not checked"
note = "P >= 10, LP 6-9, VUS 0-5, LB -1 to -6, B <= -7: consistent with Tavtigian 2020 as summarised elsewhere; the paper was not re-read."

[[signoff]]
item = "combining_table"
reviewer = "Claude (AI, claude-opus-5-5)"
kind = "ai"
date = "2026-11-21"
verdict = "matches source, reading noted"
checked_against = "Richards 2015 Table 5 (PMC4544753 text); ClinGen PM2 v1.0 PDF; Pejaver 2022 Discussion; Brnich 2019 (PMC6938631); Tavtigian 2020; ERepo snapshot 2026-11-21"
note = "Every 2015 row matches. The ClinGen 2020 row (VS + 1 Supporting = LP) is in the PM2 PDF. The Pejaver 2022 row is written for BP4_Moderate; applying it to any Moderate benign evidence is this reviewer's reading (Richards 2015 combines by strength, Brnich 2019 defines BS3_Moderate, and -2 points equals the existing two-Supporting row). The '2 Very Strong = Pathogenic' row is printed in no paper: it follows from Tavtigian 2020 (16 points, Pathogenic from 10) and all 58 ERepo expert-panel classifications with two Very Strong criteria are Pathogenic. It also closes a gap: 2 VS + 2 Strong benign used to show Likely pathogenic instead of withholding."

