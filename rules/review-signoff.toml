# Per-entry review sign-off for rules/acmg-amp-points.toml.
#
# kind = "ai" is a review by an AI model. It is recorded so a human reviewer
# can see what was checked, against what, and what was not. It never makes the
# rule file "reviewed": [meta].status may say reviewed only when every entry
# has a human sign-off (the test `signoff` enforces both).
# verdict: "matches source", "matches source, reading noted", "not checked".

[[signoff]]
item = "points"
reviewer = "Claude (AI, claude-opus-5-5)"
kind = "ai"
date = "2026-11-21"
verdict = "not checked"
note = "Tavtigian 2020 values (1/2/4/8) are the widely published ones, but the paper was not re-read in this review."

[[signoff]]
